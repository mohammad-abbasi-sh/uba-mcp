[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uba-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for UBA German air quality — hourly measurements and LQI from 400+ stations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
uba-mcp = "uba_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uba_mcp"]
